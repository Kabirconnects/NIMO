packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  msw: false
  bcrypt: true
  # better-sqlite3 ships a prebuilt binary; running its install script needs a
  # local toolchain and fails here. `false` says "do not run it" explicitly, so
  # pnpm stops failing the install with ERR_PNPM_IGNORED_BUILDS.
  better-sqlite3: false
